  <text x="800" y="338" class="small" fill="#1677ff">全选本组</text><text x="862" y="338" text-anchor="end" class="small muted">2 项</text>
  <!-- system group -->
  <rect x="170" y="366" width="710" height="48" rx="6" fill="#f3f8ff"/>
  <path d="M188 385 l5 5 5-5" fill="none" stroke="#1677ff" stroke-width="1.5"/>
  <rect x="208" y="379" width="18" height="18" rx="4" fill="#1677ff"/>
  <rect x="238" y="380" width="16" height="16" rx="3" fill="#fff" stroke="#1677ff"/><rect x="241" y="386" width="10" height="4" rx="1" fill="#1677ff"/>
  <text x="266" y="394" class="body" font-weight="700">系统管理</text><text x="336" y="394" class="code">system</text>
  <text x="800" y="394" class="small" fill="#1677ff">全选本组</text><text x="862" y="394" text-anchor="end" class="small muted">18 项</text>
  <line x1="216" y1="414" x2="216" y2="628" stroke="#dce5f2"/>
