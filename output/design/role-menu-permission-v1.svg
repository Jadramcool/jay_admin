    <line x1="216" y1="438" x2="242" y2="438" stroke="#dce5f2"/><rect x="250" y="428" width="16" height="16" rx="3" fill="#1677ff"/><path d="M254 436l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="280" y="441" class="body">用户管理</text><rect x="352" y="423" width="82" height="24" rx="12" fill="#f1f3f6"/><text x="393" y="439" text-anchor="middle" class="code">system:user</text><text x="862" y="441" text-anchor="end" class="small muted">5 项</text>
    <line x1="216" y1="486" x2="242" y2="486" stroke="#dce5f2"/><rect x="250" y="476" width="16" height="16" rx="3" fill="#1677ff"/><path d="M254 484l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="280" y="489" class="body">角色管理</text><rect x="352" y="471" width="82" height="24" rx="12" fill="#f1f3f6"/><text x="393" y="487" text-anchor="middle" class="code">system:role</text><text x="862" y="489" text-anchor="end" class="small muted">5 项</text>
    <line x1="216" y1="534" x2="242" y2="534" stroke="#dce5f2"/><rect x="250" y="524" width="16" height="16" rx="3" fill="#fff" stroke="#1677ff"/><rect x="253" y="530" width="10" height="4" rx="1" fill="#1677ff"/><text x="280" y="537" class="body">菜单管理</text><rect x="352" y="519" width="86" height="24" rx="12" fill="#f1f3f6"/><text x="395" y="535" text-anchor="middle" class="code">system:menu</text><text x="862" y="537" text-anchor="end" class="small muted">5 项</text>
    <line x1="216" y1="582" x2="242" y2="582" stroke="#dce5f2"/><rect x="250" y="572" width="16" height="16" rx="3" fill="#fff" stroke="#b5bdc9"/><text x="280" y="585" class="body">部门管理</text><rect x="352" y="567" width="86" height="24" rx="12" fill="#f1f3f6"/><text x="395" y="583" text-anchor="middle" class="code">system:dept</text><text x="862" y="585" text-anchor="end" class="small muted">3 项</text>
  </g>
  <!-- log group -->
  <rect x="170" y="636" width="710" height="48" rx="6" fill="#fafbfd"/>
  <path d="M188 655 l5 5 5-5" fill="none" stroke="#7b8494" stroke-width="1.5"/><rect x="208" y="649" width="18" height="18" rx="4" fill="#7f8ca3"/>
  <rect x="238" y="650" width="16" height="16" rx="3" fill="#1677ff"/><path d="M242 658l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text x="266" y="664" class="body" font-weight="600">日志管理</text><text x="336" y="664" class="code">log</text><text x="800" y="664" class="small" fill="#1677ff">全选本组</text><text x="862" y="664" text-anchor="end" class="small muted">6 项</text>
  <line x1="216" y1="684" x2="216" y2="768" stroke="#dce5f2"/>
  <line x1="216" y1="708" x2="242" y2="708" stroke="#dce5f2"/><rect x="250" y="698" width="16" height="16" rx="3" fill="#1677ff"/><path d="M254 706l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="280" y="711" class="body">登录日志</text><rect x="352" y="693" width="70" height="24" rx="12" fill="#f1f3f6"/><text x="387" y="709" text-anchor="middle" class="code">log:login</text>
  <line x1="216" y1="756" x2="242" y2="756" stroke="#dce5f2"/><rect x="250" y="746" width="16" height="16" rx="3" fill="#1677ff"/><path d="M254 754l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="280" y="759" class="body">操作日志</text><rect x="352" y="741" width="92" height="24" rx="12" fill="#f1f3f6"/><text x="398" y="757" text-anchor="middle" class="code">log:operation</text>
  <!-- tools -->
  <rect x="170" y="796" width="710" height="48" rx="6" fill="#fafbfd"/><path d="M188 815 l5 5 5-5" fill="none" stroke="#7b8494" stroke-width="1.5"/><rect x="208" y="809" width="18" height="18" rx="4" fill="#7f8ca3"/><rect x="238" y="810" width="16" height="16" rx="3" fill="#fff" stroke="#b5bdc9"/><text x="266" y="824" class="body" font-weight="600">系统工具</text><text x="336" y="824" class="code">tools</text><text x="862" y="824" text-anchor="end" class="small muted">10 项</text>

  <!-- right summary -->
  <rect x="920" y="206" width="366" height="658" rx="10" fill="#f8fafc" stroke="#e2e7ef"/>
  <text x="948" y="240" class="section">授权摘要</text>
