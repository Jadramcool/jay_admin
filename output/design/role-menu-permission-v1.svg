<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#17233d" flood-opacity=".18"/></filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1f2937; }
      .muted { fill:#8a93a3; } .small { font-size:12px; } .body { font-size:14px; } .title { font-size:20px; font-weight:700; }
      .section { font-size:15px; font-weight:700; } .code { font-size:11px; fill:#7b8494; }
    </style>
  </defs>

  <!-- dimmed role-management page -->
  <rect width="1440" height="1000" fill="#eef2f7"/>
  <rect x="0" y="0" width="220" height="1000" fill="#17233d"/>
  <text x="32" y="52" fill="#fff" font-size="20" font-weight="700">JDM ADMIN</text>
  <rect x="16" y="108" width="188" height="44" rx="6" fill="#2d68ff" opacity=".65"/>
  <text x="48" y="136" fill="#fff" font-size="14">系统管理</text>
  <rect x="248" y="42" width="1156" height="70" rx="8" fill="#fff"/>
  <text x="276" y="84" font-size="18" font-weight="700">角色管理</text>
  <rect x="248" y="136" width="1156" height="124" rx="8" fill="#fff"/>
  <rect x="272" y="164" width="240" height="36" rx="5" fill="#f5f7fa"/>
  <rect x="528" y="164" width="240" height="36" rx="5" fill="#f5f7fa"/>
  <rect x="248" y="280" width="1156" height="610" rx="8" fill="#fff"/>
  <g opacity=".2"><rect x="272" y="330" width="1108" height="1" fill="#6b7280"/><rect x="272" y="390" width="1108" height="1" fill="#6b7280"/><rect x="272" y="450" width="1108" height="1" fill="#6b7280"/></g>
  <rect width="1440" height="1000" fill="#15213a" opacity=".38"/>

  <!-- modal -->
  <g filter="url(#shadow)">
    <rect x="120" y="55" width="1200" height="890" rx="14" fill="#fff"/>
  </g>

  <!-- header -->
  <text x="154" y="98" class="title">分配菜单权限</text>
  <rect x="318" y="75" width="100" height="30" rx="15" fill="#eaf2ff"/>
  <text x="368" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1677ff">运营管理员</text>
  <text x="434" y="95" class="small muted">角色编码：operator</text>
  <text x="1282" y="96" font-size="24" class="muted">×</text>
  <line x1="120" y1="124" x2="1320" y2="124" stroke="#edf0f4"/>
  <rect x="154" y="142" width="1132" height="42" rx="7" fill="#eef6ff"/>
  <circle cx="178" cy="163" r="9" fill="#1677ff"/>
  <text x="178" y="167" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">i</text>
  <text x="198" y="168" class="body" fill="#31567f">为该角色配置可访问的菜单及页面操作权限</text>

  <!-- left column -->
  <text x="154" y="222" class="section">权限菜单</text>
  <text x="229" y="222" class="small muted">共 36 项</text>
  <rect x="154" y="240" width="354" height="38" rx="7" fill="#fff" stroke="#d9dee8"/>
  <circle cx="176" cy="259" r="7" fill="none" stroke="#8b95a5" stroke-width="1.5"/><line x1="181" y1="264" x2="187" y2="270" stroke="#8b95a5" stroke-width="1.5"/>
  <text x="200" y="264" class="body muted">搜索菜单名称或权限标识</text>
