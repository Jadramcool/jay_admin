  <text x="621" y="264" text-anchor="middle" class="small muted">已选择</text>
  <text x="687" y="264" text-anchor="middle" class="small muted">未选择</text>
  <rect x="734" y="240" width="76" height="38" rx="7" fill="#fff" stroke="#d9dee8"/><text x="772" y="264" text-anchor="middle" class="small">展开全部</text>
  <rect x="820" y="240" width="76" height="38" rx="7" fill="#fff" stroke="#d9dee8"/><text x="858" y="264" text-anchor="middle" class="small">收起全部</text>

  <!-- tree container -->
  <rect x="154" y="294" width="742" height="570" rx="9" fill="#fff" stroke="#e2e7ef"/>
  <!-- dashboard -->
  <rect x="170" y="310" width="710" height="48" rx="6" fill="#fafbfd"/>
  <path d="M188 329 l5 5 5-5" fill="none" stroke="#7b8494" stroke-width="1.5"/>
  <rect x="208" y="323" width="18" height="18" rx="4" fill="#1677ff"/><path d="M212 332h10M217 327v10" stroke="#fff" stroke-width="1.5"/>
  <rect x="238" y="324" width="16" height="16" rx="3" fill="#1677ff"/><path d="M242 332l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/>
