  <rect x="948" y="298" width="310" height="7" rx="4" fill="#e7ebf1"/><rect x="948" y="298" width="155" height="7" rx="4" fill="#1677ff"/>
  <rect x="948" y="325" width="88" height="30" rx="15" fill="#eaf2ff"/><text x="992" y="345" text-anchor="middle" class="small" fill="#1677ff">菜单 8</text>
  <rect x="1045" y="325" width="88" height="30" rx="15" fill="#eef9f2"/><text x="1089" y="345" text-anchor="middle" class="small" fill="#18a058">页面 6</text>
  <rect x="1142" y="325" width="88" height="30" rx="15" fill="#fff5e8"/><text x="1186" y="345" text-anchor="middle" class="small" fill="#d9822b">按钮 4</text>
  <line x1="948" y1="380" x2="1258" y2="380" stroke="#e2e7ef"/>
  <text x="948" y="414" class="section">本次变更</text>
  <rect x="948" y="430" width="100" height="28" rx="6" fill="#eaf8ef"/><text x="998" y="449" text-anchor="middle" class="small" fill="#18a058">＋ 新增 3 项</text>
  <rect x="1058" y="430" width="100" height="28" rx="6" fill="#fff0f0"/><text x="1108" y="449" text-anchor="middle" class="small" fill="#d03050">− 移除 1 项</text>
  <circle cx="956" cy="484" r="8" fill="#eaf8ef"/><text x="956" y="488" text-anchor="middle" class="small" fill="#18a058">+</text><text x="976" y="489" class="body">用户新增</text><text x="1246" y="489" text-anchor="end" class="small muted">system:user:create</text>
  <circle cx="956" cy="520" r="8" fill="#eaf8ef"/><text x="956" y="524" text-anchor="middle" class="small" fill="#18a058">+</text><text x="976" y="525" class="body">用户导出</text><text x="1246" y="525" text-anchor="end" class="small muted">system:user:export</text>
  <circle cx="956" cy="556" r="8" fill="#fff0f0"/><text x="956" y="560" text-anchor="middle" class="small" fill="#d03050">−</text><text x="976" y="561" class="body">菜单删除</text><text x="1246" y="561" text-anchor="end" class="small muted">system:menu:delete</text>
  <text x="948" y="597" class="small" fill="#1677ff">查看全部 4 项变更 →</text>
  <rect x="948" y="624" width="310" height="86" rx="8" fill="#fff8e8" stroke="#f4d99b"/>
  <circle cx="970" cy="648" r="10" fill="#f0a020"/><text x="970" y="652" text-anchor="middle" class="small" fill="#fff">!</text>
  <text x="990" y="651" class="body" font-weight="700" fill="#8c5c00">最小权限原则</text>
  <text x="970" y="680" class="small" fill="#7a6740">请仅授予该角色完成工作所需的权限，</text><text x="970" y="698" class="small" fill="#7a6740">避免无关的高风险操作权限。</text>
  <rect x="948" y="736" width="310" height="38" rx="7" fill="#fff" stroke="#ccd3dd"/><text x="1103" y="760" text-anchor="middle" class="body">↶ 恢复原权限</text>
  <text x="948" y="815" class="small muted">高风险权限</text><circle cx="1024" cy="811" r="4" fill="#d03050"/><text x="1036" y="815" class="small muted">删除、导出、授权等操作将特别标记</text>

  <!-- footer -->
  <line x1="120" y1="884" x2="1320" y2="884" stroke="#e7ebf1"/>
  <text x="154" y="920" class="small muted">上次更新：2026-07-18 14:32</text>
  <rect x="1032" y="898" width="84" height="38" rx="7" fill="#fff" stroke="#cfd6df"/><text x="1074" y="922" text-anchor="middle" class="body">取消</text>
  <rect x="1128" y="898" width="158" height="38" rx="7" fill="#1677ff"/><text x="1207" y="922" text-anchor="middle" class="body" fill="#fff" font-weight="700">保存权限（4 项变更）</text>
</svg>
